# /etc/opendkim.conf en mail.horizonte.internal — FIRMA los correos que salen del colegio
Syslog                  yes
UMask                   007
Mode                    sv
Domain                  horizonte.internal
Selector                mail
KeyFile                 /etc/opendkim/keys/mail.private
Canonicalization        relaxed/simple
Socket                  inet:8891@localhost
PidFile                 /run/opendkim/opendkim.pid
OversignHeaders         From
UserID                  opendkim
# TODO: si ves "key not found in DNS", investiga qué resolutor usa OpenDKIM (opción Nameservers)
# OpenDKIM no usa el DNS interno de Docker: se le indica el resolutor del colegio
Nameservers             10.10.10.4